name: Auto-merge validated PRs

# Sloučí PR až POTOM, co mu prošla validace (workflow "Validate distro scripts").
# Neprošlá validace = komentář do PR s odkazem na log, aby ho agent opravil.
# PR, které mění tools/ nebo .github/, se neslučují automaticky (validátor
# a CI smí měnit jen člověk).
on:
  workflow_run:
    workflows: ["Validate distro scripts"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  merge:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const owner = context.repo.owner, repo = context.repo.repo;
            const prs = run.pull_requests || [];
            if (!prs.length) { core.info('Run nepatří k PR z tohoto repa; konec.'); return; }
            const number = prs[0].number;
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: number });
            const comment = body => github.rest.issues.createComment({ owner, repo, issue_number: number, body });

            if (pr.state !== 'open') { core.info(`PR #${number} není otevřený.`); return; }
            if (pr.head.sha !== run.head_sha) {
              core.info('Od validace přibyly commity — počká se na novou validaci.');
              return;
            }
            if (run.conclusion !== 'success') {
              await comment(`❌ Validace neprošla (${run.conclusion}), PR se nesloučí.\n\n` +
                `Log: ${run.html_url}\n\nOprav skript podle výstupu \`tools/validate.py\` a pushni znovu ` +
                `(nebo lokálně: \`python3 tools/validate.py --full --require-arch <skript>.sh\`).`);
              core.setFailed('Validation failed');
              return;
            }
            const files = await github.paginate(github.rest.pulls.listFiles, { owner, repo, pull_number: number });
            const guarded = files.map(f => f.filename).filter(f => f.startsWith('tools/') || f.startsWith('.github/'));
            if (guarded.length) {
              await comment(`⏸ PR mění ${guarded.join(', ')} — validátor/CI se neslučují automaticky, ` +
                `čeká na ruční review.`);
              return;
            }
            for (let i = 0; i < 20; i++) {
              const { data } = await github.rest.pulls.get({ owner, repo, pull_number: number });
              if (data.mergeable === true) {
                await github.rest.pulls.merge({ owner, repo, pull_number: number, merge_method: 'merge',
                  sha: run.head_sha, commit_title: `Auto-merge PR #${number}: ${data.title}` });
                core.info(`Sloučeno #${number}`);
                return;
              }
              if (data.mergeable === false) {
                await comment(`Automatické sloučení selhalo: PR není mergeable (${data.mergeable_state}).`);
                core.setFailed('Not mergeable');
                return;
              }
              await new Promise(r => setTimeout(r, 3000));
            }
            await comment('Automatické sloučení vypršelo při čekání na mergeable stav.');
            core.setFailed('Timed out');
